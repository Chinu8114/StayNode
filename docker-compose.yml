services:
  mysql:
    image: mysql:8.4
    container_name: staynode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-staynode}
      MYSQL_USER: ${DB_USER:-staynode}
      MYSQL_PASSWORD: ${DB_PASSWORD:-staynode_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - staynode_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: staynode-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-staynode}
      DB_USER: ${DB_USER:-staynode}
      DB_PASSWORD: ${DB_PASSWORD:-staynode_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-very-long-random-string-at-least-32-bytes-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
    expose:
      - "5000"

  web:
    image: nginx:alpine
    container_name: staynode-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  staynode_mysql_data:
